<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#26303d;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#4ea1ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.93);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px;white-space:nowrap}
  header .sub{color:var(--dim);font-size:12px;white-space:nowrap}
  #q{flex:1 1 320px;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--fg);padding:9px 12px;font-size:14px;outline:none}
  #q:focus{border-color:var(--accent)}
  .layout{display:flex;align-items:flex-start;gap:18px;padding:18px 20px 60px;max-width:1500px;margin:0 auto}
  aside{width:238px;flex:0 0 238px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  aside h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:6px 6px 8px;font-weight:600}
  .cat{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:#c9d4df}
  .cat:hover{background:var(--panel2)}
  .cat.on{background:#1f3350;color:#fff}
  .cat b{color:var(--dim);font-weight:500;font-size:11.5px}
  main{flex:1;min-width:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  select{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:13px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#c9d4df;user-select:none}
  .chip.on{background:#16324d;border-color:#2d5d8f;color:#cfe6ff}
  .count{color:var(--dim);font-size:12.5px;margin-left:auto}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .row:hover{border-color:#33405a}
  .row .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .row .name{font-weight:600;font-size:14.5px}
  .row .desc{color:#a9b6c3;font-size:13px;margin-top:3px}
  .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .tag.cat{color:#9ecbff;border-color:#274765;background:#132234}
  .tag.mcp{color:#d7b3ff;border-color:#3d2a55;background:#1d1428}
  .tag.ok{color:var(--ok);border-color:#1c3d24;background:#0f2415}
  .tag.bad{color:var(--bad);border-color:#4a1f1f;background:#25100f}
  .tag.warn{color:var(--warn);border-color:#3d3113;background:#221c0c}
  .tag a{color:inherit}
  #more{display:block;width:100%;margin:14px 0;padding:11px;background:var(--panel);border:1px dashed var(--line);
    color:#c9d4df;border-radius:9px;cursor:pointer;font-size:13px}
  #more:hover{border-color:var(--accent);color:#fff}
  .empty{color:var(--dim);padding:30px 6px;text-align:center}
  .note{font-size:12px;color:var(--dim);margin:0 0 14px;line-height:1.7}
  .mob{display:none}
  @media (max-width:900px){
    aside{display:none} .layout{padding:14px 12px 40px}
    .mob{display:inline-block}
    header{padding:12px 14px}
    header .sub{white-space:normal}
    .note{overflow-wrap:anywhere}
    .note code{word-break:break-all}
  }
</style>
</head>

<header>

      <select id="catSel" class="mob"><option value="">全部分类</option></select>

    <div id="list"></div>
    <button id="more" hidden>加载更多</button>
  </main>
</div>

<script>
const DB = JSON.parse(document.getElementById('data').textContent);
const E = DB.entries, CATS = DB.cats;
const PAGE = 300;
let shown = PAGE, cur = '', q = '', kind = '', flags = new Set();

/* 分类侧栏 */
const catBox = document.getElementById('cats');
function renderCats(){
  const all = document.createElement('div');
  all.className = 'cat' + (cur === '' ? ' on' : '');
  const s0 = document.createElement('span'); s0.textContent = '全部';
  const b0 = document.createElement('b'); b0.textContent = E.length;
  all.append(s0, b0);
  all.onclick = () => { cur = ''; shown = PAGE; renderCats(); if (catSel) catSel.value = ''; render(); };
  catBox.replaceChildren(all);
  Object.keys(CATS).sort((a,b)=>a.localeCompare(b)).forEach(c=>{
    const d = document.createElement('div');
    d.className = 'cat' + (cur === c ? ' on' : '');
    const s = document.createElement('span'); s.textContent = c;
    const b = document.createElement('b'); b.textContent = CATS[c];
    d.append(s, b);
    d.onclick = () => { cur = (cur === c ? '' : c); shown = PAGE; renderCats(); if (catSel) catSel.value = cur; render(); };
    catBox.appendChild(d);
  });
}

/* 认证下拉 */
const authSel = document.getElementById('auth');
[...new Set(E.map(e => e.auth))].sort().forEach(a => {
  const o = document.createElement('option'); o.value = a; o.textContent = a; authSel.appendChild(o);
});
authSel.onchange = () => { shown = PAGE; render(); };

/* 手机上侧栏是隐藏的，补一个分类下拉 */
const catSel = document.getElementById('catSel');
Object.keys(CATS).sort((a, b) => a.localeCompare(b)).forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c + ' (' + CATS[c] + ')';
  catSel.appendChild(o);
});
catSel.onchange = () => { cur = catSel.value; shown = PAGE; renderCats(); render(); };

document.querySelectorAll('.chip[data-f]').forEach(el => {
  el.onclick = () => {
    const f = el.dataset.f;
    flags.has(f) ? flags.delete(f) : flags.add(f);
    el.classList.toggle('on', flags.has(f));
    shown = PAGE; render();
  };
});
document.querySelectorAll('.chip[data-k]').forEach(el => {
  el.onclick = () => {
    kind = el.dataset.k;
    document.querySelectorAll('.chip[data-k]').forEach(x => x.classList.toggle('on', x === el));
    shown = PAGE; render();
  };
});

const qEl = document.getElementById('q');
qEl.oninput = () => { q = qEl.value.trim().toLowerCase(); shown = PAGE; render(); };

function match(e){
  if (kind && e.kind !== kind) return false;
  if (cur && e.cat !== cur) return false;
  if (authSel.value && e.auth !== authSel.value) return false;
  if (flags.has('https') && e.https !== 'Yes') return false;
  if (flags.has('cors') && e.cors !== 'Yes') return false;
  if (flags.has('noauth') && e.auth !== 'None') return false;
  if (q){
    const hay = (e.name + ' ' + e.desc + ' ' + e.cat + ' ' + e.auth + ' ' + (e.transport || '') + ' ' + e.url).toLowerCase();
    return q.split(/\s+/).every(t => hay.includes(t));
  }
  return true;
}

function tag(cls, text){
  const s = document.createElement('span'); s.className = 'tag ' + (cls || ''); s.textContent = text; return s;
}

function render(){
  const hits = E.filter(match);
  const list = document.getElementById('list');
  const frag = document.createDocumentFragment();
  hits.slice(0, shown).forEach(e => {
    const row = document.createElement('div'); row.className = 'row';
    const top = document.createElement('div'); top.className = 'top';
    const a = document.createElement('a'); a.className = 'name'; a.href = e.url;
    a.target = '_blank'; a.rel = 'noreferrer'; a.textContent = e.name; top.appendChild(a);
    const desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = e.desc;
    const tags = document.createElement('div'); tags.className = 'tags';
    tags.appendChild(tag('cat', e.cat));
    if (e.kind === 'mcp'){
      tags.appendChild(tag('mcp', 'MCP'));
      tags.appendChild(tag(e.auth === 'None' ? 'ok' : 'warn', '认证: ' + e.auth));
      tags.appendChild(tag('', '传输: ' + e.transport));
      (e.install || []).forEach(l => {
        const s = document.createElement('span'); s.className = 'tag';
        const x = document.createElement('a'); x.href = l.url; x.target = '_blank';
        x.rel = 'noreferrer'; x.textContent = '装到 ' + l.label; s.appendChild(x);
        tags.appendChild(s);
      });
    } else {
      tags.appendChild(tag(e.auth === 'None' ? 'ok' : 'warn', '认证: ' + e.auth));
      tags.appendChild(tag(e.https === 'Yes' ? 'ok' : 'bad', 'HTTPS: ' + e.https));
      tags.appendChild(tag(e.cors === 'Yes' ? 'ok' : (e.cors === 'No' ? 'bad' : ''), 'CORS: ' + e.cors));
    }
    row.append(top, desc, tags);
    frag.appendChild(row);
  });
  list.replaceChildren(frag);
  if (!hits.length){
    const d = document.createElement('div'); d.className = 'empty'; d.textContent = '没有匹配的 API，换个词试试～';
    list.appendChild(d);
  }
  const more = document.getElementById('more');
  more.hidden = hits.length <= shown;
  more.textContent = '加载更多（还有 ' + Math.max(0, hits.length - shown) + ' 条）';
  document.getElementById('cnt').textContent = '匹配 ' + hits.length + ' / ' + E.length + ' 条';
}

document.getElementById('more').onclick = () => { shown += PAGE; render(); };
renderCats(); render();
</script>
</body>
